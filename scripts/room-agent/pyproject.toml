[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-agent"
version = "0.10.2"
description = "Durable orchestration foundation for Room reconstruction"
requires-python = ">=3.10"
dependencies = ["langgraph==1.2.20", "langgraph-checkpoint-sqlite==3.1.3"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
room-agent = "room_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
room_agent = ["dashboard.html", "skills/spatial-edit/SKILL.md", "skills/spatial-review/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
